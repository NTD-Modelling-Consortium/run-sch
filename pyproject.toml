[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sth_amis"]

[project]
name = "sth_sch_amis"
version = "1.0.0dev"
authors = [
  {name = "NTD Modelling Consortium"},
]
description = "STH/SCH AMIS integration pipeline"
readme = "README-docker-fitting.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas",
    "numpy"
]

requires-python = ">= 3.9"

[project.optional-dependencies]
dev = [
    "pytest"
]
